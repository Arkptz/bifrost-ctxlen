# Integration stand: build the plugin, drop it into a shared volume, and start a
# bifrost that loads it.
#
# This exists because a passing `go test` does not answer the only question that
# matters before deploying — does this .so actually load into a real gateway.
# Run it and watch the bifrost logs: a version mismatch shows up as
# "plugin was built with a different version of package ...".
#
#   BIFROST_IMAGE=your/dynamic-bifrost:tag docker compose up --build
#
# BIFROST_IMAGE IS REQUIRED and has no working default. It must be an image that
# is (1) built from the SAME core version as go.mod and (2) DYNAMICALLY linked.
# The published `maximhq/bifrost` images are statically linked — upstream's
# Dockerfile builds with `-extldflags '-static'` — and a static Go binary cannot
# dlopen a plugin AT ALL, so pointing this at a published tag guarantees the
# stand fails, not that it works. There is no digest we could pin here that
# would; the gateway you actually deploy against has to be built dynamically
# (this repo's own Dockerfile artifact stage, or your fleet's build). Supply
# that image. Verify it first:  go version -m <image>:/app/bifrost-http | grep static

services:
  plugin-build:
    build:
      context: .
      args:
        GO_VERSION: ${GO_VERSION:-1.27.0}
        PLUGIN: ${PLUGIN:-bifrost-ctxlen}
    volumes:
      - plugins:/shared
    # One-shot: copies the .so out and exits.
    restart: "no"

  bifrost:
    # No default on purpose: `?` makes compose refuse to start with a clear
    # message instead of pulling a static image that can never load a plugin.
    image: ${BIFROST_IMAGE:?set BIFROST_IMAGE to a DYNAMICALLY linked bifrost built from the same core version as go.mod; published maximhq/bifrost images are static and cannot dlopen}
    depends_on:
      plugin-build:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - plugins:/app/plugins:ro
      - ./compose/bifrost:/app/config:ro
    environment:
      # The plugin must run BEFORE the built-in governance and routing plugins
      # if it means to influence them; the default placement is post_builtin,
      # which is too late. Configure that in the plugin row, e.g.
      #   {"name": "hello-world",
      #    "path": "/app/plugins/bifrost-ctxlen.so",
      #    "placement": "pre_builtin",
      #    "enabled": true}
      APP_PORT: "8080"

volumes:
  plugins:
