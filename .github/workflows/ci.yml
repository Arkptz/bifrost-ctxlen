name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  fmt:
    name: gofumpt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofumpt (fail if any file needs formatting)
        run: |
          go install mvdan.cc/gofumpt@latest
          unformatted=$(gofumpt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofumpt-clean:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      # install-mode: goinstall, not the default prebuilt binary.
      #
      # golangci-lint refuses to analyse a module whose `go` directive is newer
      # than the Go release its own binary was built with: the published v2.6.2
      # is built with Go 1.25 and bails out on this module's `go 1.27.0` with
      # "the Go language version used to build golangci-lint is lower than the
      # targeted Go version". Building it from source with the toolchain
      # setup-go just installed sidesteps that, at the cost of a slower job.
      #
      # Revert to the binary once upstream publishes a release built with Go
      # 1.27 or newer.
      - uses: golangci/golangci-lint-action@25e2cdc5eb1d7a04fdc45ff538f1a00e960ae128 # v8.0.0
        with:
          version: v2.6.2
          install-mode: goinstall

  test:
    name: go test -race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  plugin:
    name: build .so and load it
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      # A unit test exercises the hooks in-process and says nothing about
      # whether the .so loads: Go compares a hash of every package shared with
      # the loading binary, so an indirect dependency moving is enough to break
      # plugin.Open. ci/loader dlopens the artefact and resolves every symbol
      # bifrost would, which turns that into a build failure here.
      #
      # It proves agreement with the core version in go.mod — NOT with a
      # patched, self-built host. See README.md.
      - name: build the plugin and load it through the harness
        env:
          CGO_ENABLED: "1"
        run: make verify

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: crate-ci/typos@37bb98842b0d8c4ffebdb75301a13db0267cef89 # v1.47.2

  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - if: ${{ env.ACT == 'true' }}
        run: echo "::notice::flake-check is skipped under act — run 'nix flake check' in your devshell"
      - if: ${{ env.ACT != 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - if: ${{ env.ACT != 'true' }}
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - if: ${{ env.ACT != 'true' }}
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - if: ${{ env.ACT != 'true' }}
        run: nix flake check -L
